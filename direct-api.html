<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教备AI - 直连版（无需后端）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f7fa; padding: 20px; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
        .result { background: white; border-radius: 12px; padding: 30px; margin-top: 30px; display: none; }
        .loading { text-align: center; padding: 40px; display: none; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto;">
        <div style="background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <h1 style="font-size: 28px; color: #1f2937; margin-bottom: 10px;">🤖 教备AI - 直连版演示</h1>
            <p style="color: #6b7280; margin-bottom: 30px;">此版本直接调用通义千问API，无需启动后端服务器</p>
            
            <div style="background: #fef3c7; border: 2px solid #f59e0b; border-radius: 8px; padding: 15px; margin-bottom: 30px;">
                <p style="color: #92400e; font-weight: 600;">⚠️ API密钥安全提醒</p>
                <p style="color: #92400e; font-size: 14px; margin-top: 8px;">请在下方输入你的通义千问API密钥（勿与他人共享）</p>
            </div>
            
            <div style="margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #374151;">API密钥</label>
                <input type="password" id="api-key" value="sk-8b7083c061f24062bca0959e3f7d37f0" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;" placeholder="输入你的通义千问API密钥">
                <p style="font-size: 12px; color: #6b7280; margin-top: 8px;">获取地址：<a href="https://dashscope.aliyun.com/" target="_blank">https://dashscope.aliyun.com/</a></p>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                <div>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #374151;">学科</label>
                    <select id="subject" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;">
                        <option value="数学" selected>数学</option>
                        <option value="语文">语文</option>
                        <option value="英语">英语</option>
                        <option value="物理">物理</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #374151;">年级</label>
                    <select id="grade" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;">
                        <option value="初中八年级" selected>初中八年级</option>
                        <option value="小学五年级">小学五年级</option>
                        <option value="初中七年级">初中七年级</option>
                        <option value="初中九年级">初中九年级</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #374151;">教材版本</label>
                    <select id="textbook" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;">
                        <option value="人教版" selected>人教版</option>
                        <option value="北师大版">北师大版</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #374151;">课题名称</label>
                    <input type="text" id="topic" value="勾股定理" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>
            
            <button class="btn" onclick="generate()" style="display: flex; align-items: center; gap: 10px;">
                <span id="btn-text">🚀 调用真实AI生成教案</span>
            </button>
        </div>
        
        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin" style="font-size: 48px; color: #667eea;"></i>
            <p style="margin-top: 15px; color: #6b7280;">正在调用通义千问API生成教案，请稍候...</p>
        </div>
        
        <div id="result" class="result">
            <h2 style="font-size: 22px; color: #1f2937; margin-bottom: 20px;">✅ AI生成结果</h2>
            <div id="content" style="line-height: 1.8; color: #374151;"></div>
        </div>
        
        <div id="error" class="result" style="border: 2px solid #ef4444; background: #fee2e2;">
            <h2 style="font-size: 22px; color: #991b1b; margin-bottom: 20px;">❌ 错误</h2>
            <p id="error-msg" style="color: #991b1b;"></p>
        </div>
    </div>
    
    <script>
        async function generate() {
            const apiKey = document.getElementById('api-key').value.trim();
            const subject = document.getElementById('subject').value;
            const grade = document.getElementById('grade').value;
            const textbook = document.getElementById('textbook').value;
            const topic = document.getElementById('topic').value;
            
            if (!apiKey) {
                alert('请输入API密钥！');
                return;
            }
            
            // 显示loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('btn-text').textContent = '生成中...';
            
            const prompt = `请为${grade}${subject}学科生成关于《${topic}》的完整教案。

教材版本：${textbook}

教案必须包含以下部分（请严格按照格式生成）：

# 《${topic}》教案

## 一、教学目标
1. 知识与技能：
2. 过程与方法：
3. 情感态度与价值观：

## 二、教学重难点
- 教学重点：
- 教学难点：

## 三、教学过程（45分钟）
### 1. 导入新课（5分钟）
### 2. 新课讲授（20分钟）
### 3. 课堂练习（10分钟）
### 4. 课堂小结（7分钟）
### 5. 作业布置（3分钟）

## 四、板书设计

---
请生成完整详细的内容，总字数不少于1000字。`;

            try {
                const response = await fetch('https://dashscope.aliyun.com/api/v1/services/aigc/text-generation/generation', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'qwen-max',
                        input: {
                            messages: [
                                { role: 'user', content: prompt }
                            ]
                        },
                        parameters: { temperature: 0.7, max_tokens: 2000 }
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API调用失败: ${response.status} ${errorText}`);
                }
                
                const data = await response.json();
                const content = data.output.text;
                
                // 显示结果
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                document.getElementById('content').innerText = content;
                document.getElementById('btn-text').textContent = '🚀 调用真实AI生成教案';
                
            } catch (error) {
                console.error('生成失败:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-msg').innerText = error.message;
                document.getElementById('btn-text').textContent = '🚀 调用真实AI生成教案';
            }
        }
    </script>
</body>
</html>
